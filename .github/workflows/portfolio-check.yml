name: Portfolio code checks
on:
  push:
    branches: [main, portfolio/client-first-reel-v5, portfolio/scroll-driven-ai-story-v7]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Build static portfolio and Tailwind utilities
        run: npm run build
      - name: Run syntax and source tests
        run: npm run check
      - name: Verify generated essential sections
        run: |
          grep -q 'id="journey"' index.html
          grep -q 'id="system-studio"' index.html
          grep -q 'id="contact-form"' index.html
          grep -q 'assets/css/tailwind.generated.css' index.html

  story-browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Use preinstalled Chrome with Playwright
        run: python -m pip install --disable-pip-version-check playwright==1.56.0
      - name: Exercise scroll, portrait and mobile behavior
        run: |
          python tests/scroll_story_browser.py
          python tests/portrait_browser.py
          python tests/project_detail_browser.py
          python tests/apaea_browser.py
          python tests/priority_fix_browser.py
          python tests/gitlab_collection_browser.py
          python tests/github_import_browser.py
