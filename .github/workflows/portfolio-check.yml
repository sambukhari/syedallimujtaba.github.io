name: Portfolio code checks
on:
  push:
    branches: [main, portfolio/client-first-reel-v5]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Build static portfolio and Tailwind utilities
        run: npm run build
      - name: Run syntax and source tests
        run: npm run check
      - name: Verify generated essential sections
        run: |
          grep -q 'id="journey"' index.html
          grep -q 'id="system-studio"' index.html
          grep -q 'id="contact-form"' index.html
          grep -q 'assets/css/tailwind.generated.css' index.html
