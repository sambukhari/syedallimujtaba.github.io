<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-label="EzeAD two independent applications architecture"><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#191315"/><stop offset=".55" stop-color="#0d0d10"/><stop offset="1" stop-color="#26150d"/></linearGradient><linearGradient id="flame" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#FF6210"/><stop offset="1" stop-color="#FFB15A"/></linearGradient><linearGradient id="glass" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#2A2324"/><stop offset="1" stop-color="#151316"/></linearGradient><pattern id="grid" width="50" height="50" patternUnits="userSpaceOnUse"><path d="M 50 0 H 0 V 50" fill="none" stroke="#FF8621" opacity=".08" stroke-width="1"/></pattern><filter id="glow"><feGaussianBlur stdDeviation="14"/></filter></defs><rect width="1200" height="720" fill="url(#bg)"/><rect width="1200" height="720" fill="url(#grid)"/><ellipse cx="960" cy="80" rx="240" ry="160" fill="#FF6D15" opacity=".13" filter="url(#glow)"/><text x="63" y="74" fill="#FF9E4C" font-size="18" letter-spacing="5" font-family="Arial,sans-serif" font-weight="700">SYSTEM BOUNDARIES / TWO APPLICATIONS</text><path d="M 63 100 H 1137" stroke="#FF9749" stroke-opacity=".27"/>
<text x="63" y="167" font-size="52" font-weight="800" font-family="Arial" fill="#FFF5E9">Separate systems.</text>
<text x="63" y="222" font-size="24" font-family="Arial" fill="#C5B4A4">The repository includes a primary marketplace and a distinct storefront.</text>
<rect x="62" y="272" width="510" height="326" rx="22" fill="#1D1717" stroke="#FF7928" stroke-width="2"/><rect x="628" y="272" width="510" height="326" rx="22" fill="#191618" stroke="#A4754C" stroke-width="2"/>
<text x="96" y="326" font-size="20" fill="#FF9B49" font-family="Arial" letter-spacing="2" font-weight="700">PRIMARY / MAIN APP</text>
