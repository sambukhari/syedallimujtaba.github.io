<rect x="660" y="410" width="431" height="31" rx="9" fill="#FFC28C" fill-opacity=".075"/><text x="676" y="431" font-family="Arial" font-size="18" fill="#DBC6B8">Catalog + cart</text><rect x="660" y="452" width="431" height="31" rx="9" fill="#FFC28C" fill-opacity=".075"/><text x="676" y="473" font-family="Arial" font-size="18" fill="#DBC6B8">Shipping + checkout</text><rect x="660" y="494" width="431" height="31" rx="9" fill="#FFC28C" fill-opacity=".075"/><text x="676" y="515" font-family="Arial" font-size="18" fill="#DBC6B8">Orders + wishlist</text><rect x="660" y="536" width="431" height="31" rx="9" fill="#FFC28C" fill-opacity=".075"/><text x="676" y="557" font-family="Arial" font-size="18" fill="#DBC6B8">Wallet + support tickets</text>
